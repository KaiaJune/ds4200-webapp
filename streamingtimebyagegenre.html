<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Streaming Time of Day by Genre</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      font-family: 'Poppins', Arial;
      background: #f5f7fa;
    }
    .chart-container {
      max-width: 980px;
      margin: 40px auto;
      padding: 20px;
      background: white;
      border-radius: 12px;
    }
    #chart {
      display: flex;
      justify-content: center;
    }
    .tooltip {
      position: absolute;
      opacity: 0;
      background: white;
      padding: 8px;
      border-radius: 6px;
      font-size: 12px;
    }
  </style>
</head>
<body>

<div class="chart-container">
  <h2>Streaming Time of Day by Genre</h2>

  <div>
    <label>Age Group:</label>
    <select id="ageFilter"></select>
  </div>

  <div id="chart"></div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>

const csvUrl = "https://raw.githubusercontent.com/KaiaJune/ds4200-webapp/main/ds4200_global_streaming_cleaned.csv";

d3.csv(csvUrl).then(data => {

  const timeMap = {
    "Morning": "Morning",
    "Afternoon": "Afternoon",
    "Night": "Night"
  };

  const ageGroups = ["Teen", "18 to 25", "26 to 35", "36 to 45", "46 to 60"];

  function getAgeGroup(age) {
    if (age < 18) return "Teen";
    if (age <= 25) return "18 to 25";
    if (age <= 35) return "26 to 35";
    if (age <= 45) return "36 to 45";
    if (age <= 60) return "46 to 60";
  }

  const cleaned = data.map(d => ({
    age: +d["Age"],
    genre: d["Top Genre"],
    time: timeMap[d["Listening Time (Morning/Afternoon/Night)"]],
    age_group: getAgeGroup(+d["Age"])
  }));

  const select = d3.select("#ageFilter");
  ageGroups.forEach(g => {
    select.append("option").text(g).attr("value", g);
  });

  const svg = d3.select("#chart").append("svg")
    .attr("width", 800)
    .attr("height", 500);

  const tooltip = d3.select("#tooltip");

  function render(group) {
    svg.selectAll("*").remove();

    const filtered = cleaned.filter(d => d.age_group === group);
    const genres = [...new Set(filtered.map(d => d.genre))];
    const times = ["Morning", "Afternoon", "Night"];

    const dataMatrix = [];

    genres.forEach(g => {
      const total = filtered.filter(d => d.genre === g).length;

      times.forEach(t => {
        const val = filtered.filter(d => d.genre === g && d.time === t).length;
        dataMatrix.push({
          genre: g,
          time: t,
          value: val,
          pct: total ? (val / total * 100) : 0
        });
      });
    });

    const x = d3.scaleBand().domain(times).range([100,700]);
    const y = d3.scaleBand().domain(genres).range([50,450]);

    const color = d3.scaleSequential()
      .domain([0,100])
      .interpolator(d3.interpolateBlues);

    svg.selectAll("rect")
      .data(dataMatrix)
      .enter()
      .append("rect")
      .attr("x", d => x(d.time))
      .attr("y", d => y(d.genre))
      .attr("width", x.bandwidth())
      .attr("height", y.bandwidth())
      .attr("fill", d => color(d.pct))
      .on("mouseover", (e,d)=>{
        tooltip.style("opacity",1)
          .html(`${d.genre}<br>${d.time}<br>${d.pct.toFixed(1)}%`);
      })
      .on("mousemove", e=>{
        tooltip.style("left", e.pageX+"px").style("top", e.pageY+"px");
      })
      .on("mouseout", ()=> tooltip.style("opacity",0));

    svg.append("g")
      .attr("transform","translate(0,450)")
      .call(d3.axisBottom(x));

    svg.append("g")
      .attr("transform","translate(100,0)")
      .call(d3.axisLeft(y));
  }

  select.on("change", function() {
    render(this.value);
  });

  render("18 to 25");

});

</script>

</body>
</html>
