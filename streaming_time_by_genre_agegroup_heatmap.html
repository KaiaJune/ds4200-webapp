<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Streaming Time of Day by Genre</title>
  <script src="https://d3js.org/d3.v7.min.js"></script>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      margin: 0;
      background: transparent;
      color: #333;
    }

    .embed-container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 8px 0 0 0;
      box-sizing: border-box;
    }

    .controls {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .controls label {
      font-weight: 600;
      color: #333;
      font-size: 15px;
    }

    .controls select {
      padding: 8px 12px;
      border-radius: 8px;
      border: 1px solid rgba(0, 0, 0, 0.15);
      background: #fff;
      font-size: 14px;
      color: #333;
    }

    #chart {
      width: 100%;
      display: flex;
      justify-content: center;
      overflow-x: auto;
    }

    .tooltip {
      position: absolute;
      opacity: 0;
      pointer-events: none;
      background: white;
      color: #333;
      border: 1px solid rgba(0, 0, 0, 0.12);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.45;
    }

    .axis path,
    .axis line {
      stroke: rgba(0, 0, 0, 0.18);
    }

    .axis text {
      fill: #333;
      font-size: 13px;
    }

    .axis-label {
      fill: #333;
      font-size: 14px;
      font-weight: 600;
    }

    .cell-label {
      font-size: 11px;
      text-anchor: middle;
      dominant-baseline: middle;
      pointer-events: none;
      font-weight: 600;
    }

    .legend-label {
      fill: #555;
      font-size: 12px;
    }

    .error-message {
      text-align: center;
      color: #b00020;
      font-weight: 600;
      padding: 24px;
    }
  </style>
</head>
<body>
  <div class="embed-container">
    <div class="controls">
      <label for="ageFilter">Age Group:</label>
      <select id="ageFilter"></select>
    </div>

    <div id="chart"></div>
  </div>

  <div class="tooltip" id="tooltip"></div>

  <script>
    const csvUrl = "https://raw.githubusercontent.com/KaiaJune/ds4200-webapp/main/ds4200_global_streaming_cleaned.csv";

    const ageGroups = ["All Ages", "Teen", "18-25", "26-35", "36-45", "46-60"];
    const timeOrder = [
      "Morning\n(6am to 12pm)",
      "Afternoon\n(12pm to 6pm)",
      "Night\n(6pm to 12am)"
    ];

    const timeMap = {
      "Morning": "Morning\n(6am to 12pm)",
      "Afternoon": "Afternoon\n(12pm to 6pm)",
      "Night": "Night\n(6pm to 12am)"
    };

    function getAgeGroup(age) {
      if (age < 18) return "Teen";
      if (age <= 25) return "18-25";
      if (age <= 35) return "26-35";
      if (age <= 45) return "36-45";
      if (age <= 60) return "46-60";
      return null;
    }

    d3.csv(csvUrl).then(rawData => {
      const cleaned = rawData
        .map(d => {
          const age = +d["Age"];
          const genre = (d["Top Genre"] || "").trim();
          const rawTime = (d["Listening Time (Morning/Afternoon/Night)"] || "").trim();
          const ageGroup = getAgeGroup(age);

          return {
            age,
            genre,
            time: timeMap[rawTime],
            age_group: ageGroup
          };
        })
        .filter(d => !isNaN(d.age) && d.genre && d.time && d.age_group);

      const select = d3.select("#ageFilter");
      ageGroups.forEach(group => {
        select.append("option").attr("value", group).text(group);
      });

      const margin = { top: 68, right: 25, bottom: 105, left: 135 };
      const width = 760 - margin.left - margin.right;

      const svg = d3.select("#chart")
        .append("svg")
        .attr("width", width + margin.left + margin.right);

      const chart = svg.append("g")
        .attr("transform", `translate(${margin.left},${margin.top})`);

      const tooltip = d3.select("#tooltip");

      function render(ageGroup) {
        const filtered = ageGroup === "All Ages"
          ? cleaned
          : cleaned.filter(d => d.age_group === ageGroup);

        const genres = Array.from(new Set(filtered.map(d => d.genre))).sort();
        const height = Math.max(340, genres.length * 44);

        svg.attr("height", height + margin.top + margin.bottom);
        chart.selectAll("*").remove();
        svg.selectAll(".legend-group").remove();
        svg.selectAll("defs").remove();

        const records = [];
        genres.forEach(genre => {
          const genreSubset = filtered.filter(d => d.genre === genre);
          const genreTotal = genreSubset.length;

          timeOrder.forEach(time => {
            const value = genreSubset.filter(d => d.time === time).length;
            records.push({
              age_group: ageGroup,
              genre,
              time,
              value,
              pct: genreTotal ? +(value / genreTotal * 100).toFixed(1) : 0
            });
          });
        });

        const x = d3.scaleBand()
          .domain(timeOrder)
          .range([0, width])
          .padding(0.12);

        const y = d3.scaleBand()
          .domain(genres)
          .range([0, height])
          .padding(0.10);

        const minPct = d3.min(records, d => d.pct) ?? 0;
        const maxPct = d3.max(records, d => d.pct) ?? 100;

        const color = d3.scaleSequential()
          .domain([minPct, maxPct])
          .interpolator(d3.interpolateRgb("#eaf3fb", "#1984c5"));

        const xAxis = d3.axisBottom(x);
        const xAxisG = chart.append("g")
          .attr("class", "axis")
          .attr("transform", `translate(0,${height})`)
          .call(xAxis);

        xAxisG.selectAll(".tick text")
          .each(function(d) {
            const text = d3.select(this);
            const parts = d.split("\n");
            text.text(null);
            parts.forEach((part, i) => {
              text.append("tspan")
                .attr("x", 0)
                .attr("dy", i === 0 ? 0 : 16)
                .text(part);
            });
          });

        chart.append("g")
          .attr("class", "axis")
          .call(d3.axisLeft(y));

        chart.append("text")
          .attr("class", "axis-label")
          .attr("x", width / 2)
          .attr("y", height + 84)
          .attr("text-anchor", "middle")
          .text("Time of Day");

        chart.append("text")
          .attr("class", "axis-label")
          .attr("transform", "rotate(-90)")
          .attr("x", -height / 2)
          .attr("y", -95)
          .attr("text-anchor", "middle")
          .text("Top Genre");

        chart.selectAll("rect.cell")
          .data(records)
          .enter()
          .append("rect")
          .attr("class", "cell")
          .attr("x", d => x(d.time))
          .attr("y", d => y(d.genre))
          .attr("width", x.bandwidth())
          .attr("height", y.bandwidth())
          .attr("rx", 8)
          .attr("ry", 8)
          .attr("fill", d => color(d.pct))
          .attr("stroke", "#ffffff")
          .attr("stroke-width", 1.5)
          .on("mouseover", function(event, d) {
            d3.select(this)
              .attr("stroke", "#1f4a6a")
              .attr("stroke-width", 2.4);

            tooltip.style("opacity", 1).html(
              `<strong>Age Group:</strong> ${d.age_group}<br>
               <strong>Genre:</strong> ${d.genre}<br>
               <strong>Time of Day:</strong> ${d.time.replace("\\n", " ")}<br>
               <strong>Listener Count:</strong> ${d.value}<br>
               <strong>Share within genre:</strong> ${d.pct}%`
            );
          })
          .on("mousemove", function(event) {
            tooltip
              .style("left", (event.pageX + 12) + "px")
              .style("top", (event.pageY - 28) + "px");
          })
          .on("mouseout", function() {
            d3.select(this)
              .attr("stroke", "#ffffff")
              .attr("stroke-width", 1.5);
            tooltip.style("opacity", 0);
          });

        chart.selectAll("text.cell-label")
          .data(records)
          .enter()
          .append("text")
          .attr("class", "cell-label")
          .attr("x", d => x(d.time) + x.bandwidth() / 2)
          .attr("y", d => y(d.genre) + y.bandwidth() / 2)
          .attr("fill", d => d.pct > (minPct + maxPct) / 2 ? "#ffffff" : "#333333")
          .text(d => `${d.pct}%`);

        const legendWidth = 170;
        const legendHeight = 14;
        const defs = svg.append("defs");

        const gradient = defs.append("linearGradient")
          .attr("id", "legend-gradient")
          .attr("x1", "0%")
          .attr("x2", "100%")
          .attr("y1", "0%")
          .attr("y2", "0%");

        d3.range(0, 1.01, 0.1).forEach(stop => {
          const val = minPct + stop * (maxPct - minPct);
          gradient.append("stop")
            .attr("offset", `${stop * 100}%`)
            .attr("stop-color", color(val));
        });

        const legendX = margin.left + width - legendWidth;
        const legendY = 16;

        const legend = svg.append("g").attr("class", "legend-group");

        legend.append("text")
          .attr("x", legendX)
          .attr("y", legendY - 8)
          .attr("class", "legend-label")
          .text("Lower to Higher Share");

        legend.append("rect")
          .attr("x", legendX)
          .attr("y", legendY)
          .attr("width", legendWidth)
          .attr("height", legendHeight)
          .attr("rx", 7)
          .attr("ry", 7)
          .attr("fill", "url(#legend-gradient)");

        const legendScale = d3.scaleLinear()
          .domain([minPct, maxPct])
          .range([0, legendWidth]);

        legend.append("g")
          .attr("class", "axis")
          .attr("transform", `translate(${legendX}, ${legendY + legendHeight})`)
          .call(d3.axisBottom(legendScale).ticks(4).tickFormat(d => d + "%"));
      }

      select.on("change", function() {
        render(this.value);
      });

      render("All Ages");
      select.property("value", "All Ages");
    }).catch(error => {
      console.error("Error loading CSV:", error);
      d3.select("#chart")
        .append("div")
        .attr("class", "error-message")
        .text("Unable to load the dataset. Double check the CSV path.");
    });
  </script>
</body>
</html>
