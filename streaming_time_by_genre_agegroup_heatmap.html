<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Streaming Time of Day by Genre</title>
<script src="https://d3js.org/d3.v7.min.js"></script>

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  color: #333;
  background: transparent;
}

.embed-container {
  width: 100%;
  max-width: 900px;
  margin: 0 auto;
  padding: 4px 0 0 0;
  box-sizing: border-box;
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
  flex-wrap: wrap;
}

.controls label {
  font-weight: 600;
  font-size: 14px;
}

.controls select {
  padding: 6px 10px;
  border-radius: 8px;
  border: 1px solid rgba(0,0,0,0.15);
  background: #fff;
  font-size: 13px;
  color: #333;
}

#chart {
  width: 100%;
  display: flex;
  justify-content: center;
  overflow-x: auto;
}

.tooltip {
  position: absolute;
  opacity: 0;
  pointer-events: none;
  background: white;
  color: #333;
  border: 1px solid rgba(0,0,0,0.12);
  box-shadow: 0 6px 18px rgba(0,0,0,0.12);
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 12px;
  line-height: 1.4;
}

.axis path,
.axis line {
  stroke: rgba(0,0,0,0.18);
}

.axis text {
  fill: #333;
  font-size: 12px;
}

.axis-label {
  fill: #333;
  font-size: 13px;
  font-weight: 600;
}

.cell-label {
  font-size: 10px;
  text-anchor: middle;
  dominant-baseline: middle;
  pointer-events: none;
  font-weight: 600;
}

.legend-label {
  fill: #555;
  font-size: 11px;
}

.error-message {
  text-align: center;
  color: #b00020;
  font-weight: 600;
  padding: 20px;
}
</style>
</head>
<body>

<div class="embed-container">
  <div class="controls">
    <label for="ageFilter">Age Group:</label>
    <select id="ageFilter"></select>
  </div>

  <div id="chart"></div>
</div>

<div class="tooltip" id="tooltip"></div>

<script>
const csvUrl = "https://raw.githubusercontent.com/KaiaJune/ds4200-webapp/main/ds4200_global_streaming_cleaned.csv";

const ageGroups = ["All Ages", "Teen", "18-25", "26-35", "36-45", "46-60"];

const timeOrder = [
  "Morning",
  "Afternoon",
  "Night"
];

function getAgeGroup(age) {
  if (age < 18) return "Teen";
  if (age <= 25) return "18-25";
  if (age <= 35) return "26-35";
  if (age <= 45) return "36-45";
  if (age <= 60) return "46-60";
  return null;
}

d3.csv(csvUrl).then(data => {
  const cleaned = data.map(d => ({
    age: +d["Age"],
    genre: (d["Top Genre"] || "").trim(),
    time: (d["Listening Time (Morning/Afternoon/Night)"] || "").trim(),
    age_group: getAgeGroup(+d["Age"])
  })).filter(d => d.genre && d.time && d.age_group);

  const select = d3.select("#ageFilter");
  ageGroups.forEach(group => {
    select.append("option")
      .attr("value", group)
      .text(group);
  });

  const margin = { top: 28, right: 20, bottom: 62, left: 120 };
  const width = 700 - margin.left - margin.right;

  const svg = d3.select("#chart")
    .append("svg")
    .attr("width", width + margin.left + margin.right);

  const chart = svg.append("g")
    .attr("transform", `translate(${margin.left},${margin.top})`);

  const tooltip = d3.select("#tooltip");

  function render(group) {
    const filtered = group === "All Ages"
      ? cleaned
      : cleaned.filter(d => d.age_group === group);

    const genres = [...new Set(filtered.map(d => d.genre))].sort();

    const rowHeight = 28;
    const height = Math.max(260, genres.length * rowHeight);

    svg.attr("height", height + margin.top + margin.bottom);
    chart.selectAll("*").remove();
    svg.selectAll(".legend-group").remove();
    svg.selectAll("defs").remove();

    const matrix = [];

    genres.forEach(genre => {
      const subset = filtered.filter(d => d.genre === genre);
      const total = subset.length;

      timeOrder.forEach(time => {
        const val = subset.filter(d => d.time === time).length;
        matrix.push({
          genre: genre,
          time: time,
          value: val,
          pct: total ? +(val / total * 100).toFixed(1) : 0,
          age_group: group
        });
      });
    });

    const x = d3.scaleBand()
      .domain(timeOrder)
      .range([0, width])
      .padding(0.12);

    const y = d3.scaleBand()
      .domain(genres)
      .range([0, height])
      .padding(0.08);

    const minPct = d3.min(matrix, d => d.pct) ?? 0;
    const maxPct = d3.max(matrix, d => d.pct) ?? 100;

    const color = d3.scaleSequential()
      .domain([minPct, maxPct])
      .interpolator(d3.interpolateRgb("#eaf3fb", "#1984c5"));

    chart.append("g")
      .attr("class", "axis")
      .attr("transform", `translate(0,${height})`)
      .call(d3.axisBottom(x));

    chart.append("g")
      .attr("class", "axis")
      .call(d3.axisLeft(y));

    chart.append("text")
      .attr("class", "axis-label")
      .attr("x", width / 2)
      .attr("y", height + 42)
      .attr("text-anchor", "middle")
      .text("Time of Day");

    chart.append("text")
      .attr("class", "axis-label")
      .attr("transform", "rotate(-90)")
      .attr("x", -height / 2)
      .attr("y", -95)
      .attr("text-anchor", "middle")
      .text("Top Genre");

    chart.selectAll("rect.cell")
      .data(matrix)
      .enter()
      .append("rect")
      .attr("class", "cell")
      .attr("x", d => x(d.time))
      .attr("y", d => y(d.genre))
      .attr("width", x.bandwidth())
      .attr("height", y.bandwidth())
      .attr("rx", 6)
      .attr("ry", 6)
      .attr("fill", d => color(d.pct))
      .attr("stroke", "#ffffff")
      .attr("stroke-width", 1.2)
      .on("mouseover", function(event, d) {
        d3.select(this)
          .attr("stroke", "#1f4a6a")
          .attr("stroke-width", 2);

        tooltip.style("opacity", 1).html(
          `<strong>Age Group:</strong> ${d.age_group}<br>
           <strong>Genre:</strong> ${d.genre}<br>
           <strong>Time:</strong> ${d.time}<br>
           <strong>Count:</strong> ${d.value}<br>
           <strong>Share:</strong> ${d.pct}%`
        );
      })
      .on("mousemove", function(event) {
        tooltip
          .style("left", (event.pageX + 10) + "px")
          .style("top", (event.pageY - 20) + "px");
      })
      .on("mouseout", function() {
        d3.select(this)
          .attr("stroke", "#ffffff")
          .attr("stroke-width", 1.2);
        tooltip.style("opacity", 0);
      });

    chart.selectAll("text.cell-label")
      .data(matrix)
      .enter()
      .append("text")
      .attr("class", "cell-label")
      .attr("x", d => x(d.time) + x.bandwidth() / 2)
      .attr("y", d => y(d.genre) + y.bandwidth() / 2)
      .attr("fill", d => d.pct > (minPct + maxPct) / 2 ? "#ffffff" : "#333333")
      .text(d => `${d.pct}%`);

    const legendWidth = 110;
    const legendHeight = 8;
    const legendX = width - legendWidth - 8;
    const legendY = -18;

    const defs = svg.append("defs");

    const gradient = defs.append("linearGradient")
      .attr("id", "legend-gradient")
      .attr("x1", "0%")
      .attr("x2", "100%")
      .attr("y1", "0%")
      .attr("y2", "0%");

    d3.range(0, 1.01, 0.2).forEach(stop => {
      const val = minPct + stop * (maxPct - minPct);
      gradient.append("stop")
        .attr("offset", `${stop * 100}%`)
        .attr("stop-color", color(val));
    });

    const legend = svg.append("g")
      .attr("class", "legend-group")
      .attr("transform", `translate(${margin.left},0)`);

    legend.append("text")
      .attr("x", legendX)
      .attr("y", legendY - 4)
      .attr("class", "legend-label")
      .text("Share");

    legend.append("rect")
      .attr("x", legendX)
      .attr("y", legendY)
      .attr("width", legendWidth)
      .attr("height", legendHeight)
      .attr("rx", 4)
      .attr("ry", 4)
      .attr("fill", "url(#legend-gradient)");

    legend.append("text")
      .attr("x", legendX)
      .attr("y", legendY + 18)
      .attr("class", "legend-label")
      .text(Math.round(minPct) + "%");

    legend.append("text")
      .attr("x", legendX + legendWidth)
      .attr("y", legendY + 18)
      .attr("text-anchor", "end")
      .attr("class", "legend-label")
      .text(Math.round(maxPct) + "%");
  }

  select.on("change", function() {
    render(this.value);
  });

  render("All Ages");
  select.property("value", "All Ages");
}).catch(error => {
  console.error("Error loading CSV:", error);
  d3.select("#chart")
    .append("div")
    .attr("class", "error-message")
    .text("Unable to load the dataset. Double check the CSV path.");
});
</script>

</body>
</html>
